<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qynexa Admin Panel</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    font-family: Arial, sans-serif;
    background:#000;
    color:#fff;
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
}

.card{
    background:#111;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input,textarea{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    background:gold;
    color:black;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

h1,h2{
    color:gold;
}

hr{
    border:1px solid #333;
}
</style>

</head>

<body>

<div class="container">

<h1>Qynexa Fashion Admin Panel</h1>

<div class="card">

<h2>Admin Login</h2>

<input
type="email"
id="email"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

<div class="card">

<h2>Add Product</h2>

<input
type="text"
id="productName"
placeholder="Product Name">

<textarea
id="description"
placeholder="Product Description"></textarea>

<input
type="text"
id="price"
placeholder="Price">

<input
type="text"
id="offer"
placeholder="Offer">

<input
type="text"
id="size"
placeholder="Sizes (M,L,XL,XXL)">

<input
type="text"
id="image"
placeholder="images/shirt1.jpg">

<button onclick="addProduct()">
Save Product
</button>

</div>

</div>

<!-- Firebase Libraries -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Firebase Config -->

<script src="js/firebase-config.js"></script>

<!-- Admin Functions -->

<script src="js/admin.js"></script>

</body>
</html>
